# Root logger level and appender
rootLogger.level = INFO
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = Console

# Console appender
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%r] [%-30.30t] %-5level %c{1}.%method:%line - %msg%n

# Spark streaming - reduce noise
logger.spark.name = org.apache.spark
logger.spark.level = INFO

# Spark SQL streaming internals
logger.sparkstreaming.name = org.apache.spark.sql.streaming
logger.sparkstreaming.level = INFO

# Enable DEBUG for amadeus spark datasource classes
logger.amadeus.name = com.amadeus.spark
logger.amadeus.level = DEBUG

# Enable DEBUG for mock client
logger.clientregistrytest.name = com.clientregistrytest
logger.clientregistrytest.level = DEBUG

## Specifically enable debug for streaming components
#logger.imperva.streaming.name = com.amadeus.spark.datasource.streaming
#logger.imperva.streaming.level = DEBUG
## Enable debug for client
#logger.imperva.client.name = com.amadeus.spark.datasource.client
#logger.imperva.client.level = DEBUG

# Reduce Spark internal noise
logger.jetty.name = org.eclipse.jetty
logger.jetty.level = WARN

logger.netty.name = io.netty
logger.netty.level = WARN
