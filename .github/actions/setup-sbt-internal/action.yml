name: "Setup sbt (internal)"
description: >
  Internal variant of setup-sbt for self-hosted Amadeus runners, where the
  public sbt/setup-sbt@v1 action is blocked by enterprise policy. Installs sbt
  manually, tolerating runners without sudo (assumes pre-installed sbt then).

# TODO(open-source-readiness): this composite action exists only to support
# the internal alpha-release workflow on self-hosted Amadeus runners. It
# needs the same provenance/legal review as .github/workflows/alpha-release.yml
# before publication; remove or isolate into a private overlay if not cleared.


inputs:
  java-version:
    description: "Java version to install (Temurin distribution)"
    default: "11"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: "temurin"
        java-version: ${{ inputs.java-version }}
        cache: "sbt"

    - name: "Install sbt"
      shell: bash
      run: |
        if ! command -v sbt &> /dev/null; then
          echo "Installing sbt..."
          if command -v sudo &> /dev/null; then
            echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
            curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo apt-key add
            sudo apt-get update
            sudo apt-get install -y sbt
          else
            echo "sbt not found and sudo not available - assuming sbt is pre-installed on runner"
            exit 1
          fi
        else
          echo "sbt already installed: $(sbt --version)"
        fi
