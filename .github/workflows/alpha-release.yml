name: "Alpha Release"

# Internal-only workflow: publishes an alpha of httpds-spark to the internal
# Amadeus Artifactory. It supplies the publish target to the (public, generic)
# build.sbt purely via PUBLISH_* environment variables, so no internal
# infrastructure is referenced in any file shared with the public repo.

on:
  push:
    branches: ["refactor/cleanup-for-oss"]
  workflow_dispatch:
    inputs:
      alpha_suffix:
        description: "Alpha suffix (e.g., alpha1, alpha2)"
        required: false
        default: "alpha3"

permissions:
  contents: write

jobs:
  publish-alpha:
    name: "Publish Alpha to Artifactory"
    runs-on: gmsshr-maven-amadeus-cplatform
    environment: development

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-sbt-internal
        with:
          java-version: "11"

      - name: "Set alpha version"
        id: version
        run: |
          SUFFIX="${{ inputs.alpha_suffix }}"
          SUFFIX="${SUFFIX:-alpha3}"
          ALPHA_VERSION="1.0.0-${SUFFIX}"
          echo "version=$ALPHA_VERSION" >> "$GITHUB_OUTPUT"
          echo "Setting version to $ALPHA_VERSION"

      - name: "Update version in build.sbt"
        run: |
          sed -i 's/ThisBuild \/ version := .*/ThisBuild \/ version := "${{ steps.version.outputs.version }}"/' build.sbt
          grep 'ThisBuild / version' build.sbt

      - name: "Publish to Artifactory (mvn-built)"
        env:
          PUBLISH_REPO_URL: "https://repository.rnd.amadeus.net/mvn-built/"
          PUBLISH_REPO_NAME: "Artifactory Snapshots"
          PUBLISH_REALM: "Artifactory Realm"
          PUBLISH_HOST: "repository.rnd.amadeus.net"
          PUBLISH_USER: ${{ secrets.IZ_USERNAME }}
          PUBLISH_PASSWORD: ${{ secrets.IZ_PASSWORD }}
        run: sbt publish

      - name: "Publish summary"
        run: |
          echo "## ✅ Alpha release published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`com.amadeus.spark:httpds-spark_2.12:${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | Artifactory (repository.rnd.amadeus.net/mvn-built) |" >> "$GITHUB_STEP_SUMMARY"
