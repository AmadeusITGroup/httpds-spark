name: "Alpha Release"

on:
  workflow_dispatch:
    inputs:
      alpha_suffix:
        description: "Alpha suffix (e.g., alpha1, alpha2)"
        required: false
        default: "alpha1"

permissions:
  contents: write

jobs:
  publish-alpha:
    name: "Publish Alpha to Artifactory"
    runs-on: ubuntu-latest
    environment: development
    
    steps:
      - uses: actions/checkout@v5
      
      - uses: ./.github/actions/setup-sbt
        with:
          java-version: "11"
      
      - name: "Configure git identity"
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      
      - name: "Set alpha version"
        id: version
        run: |
          ALPHA_VERSION="1.0.0-${{ inputs.alpha_suffix }}"
          echo "version=$ALPHA_VERSION" >> "$GITHUB_OUTPUT"
          echo "Setting version to $ALPHA_VERSION"
      
      - name: "Update version in build.sbt"
        run: |
          sed -i 's/ThisBuild \/ version := .*/ThisBuild \/ version := "${{ steps.version.outputs.version }}"/' build.sbt
      
      - name: "Run tests"
        run: sbt test
      
      - name: "Publish to Artifactory"
        env:
          ARTIFACTORY_DEV_USER: ${{ secrets.ARTIFACTORY_DEV_USER }}
          ARTIFACTORY_DEV_PASSWORD: ${{ secrets.ARTIFACTORY_DEV_PASSWORD }}
        run: sbt publish
      
      - name: "Create git tag"
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Alpha release ${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
      
      - name: "Publish summary"
        run: |
          echo "## ✅ Alpha release published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`com.amadeus.spark:httpds-spark_2.12:${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | Artifactory (maven-abfd-dev-local) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`v${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
